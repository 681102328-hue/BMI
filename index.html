<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน Open House - คณะเทคโนโลยีสารสนเทศ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Banner -->
    <header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white py-10 px-4 shadow-lg">
        <div class="max-w-4xl mx-auto text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">IT OPEN HOUSE REGISTRATION</h1>
            <p class="text-indigo-100 text-base md:text-lg">ระบบลงทะเบียนเข้าร่วมงานและเลือกสาขาวิชาที่สนใจ คณะเทคโนโลยีสารสนเทศ</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">
        
        <!-- Form Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-100/70 border-b border-slate-200 px-6 py-4">
                <h2 class="text-xl font-bold text-slate-700 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
                    แบบฟอร์มลงทะเบียน
                </h2>
            </div>
            
            <form id="regForm" class="p-6 md:p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    
                    <!-- คำนำหน้า -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">คำนำหน้า <span class="text-rose-500">*</span></label>
                        <select id="prefix" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                            <option value="" disabled selected>-- เลือกคำนำหน้า --</option>
                            <option value="นาย">นาย</option>
                            <option value="นางสาว">นางสาว</option>
                            <option value="เด็กชาย">เด็กชาย</option>
                            <option value="เด็กหญิง">เด็กหญิง</option>
                        </select>
                    </div>

                    <!-- ชื่อ-นามสกุล -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อ - นามสกุล <span class="text-rose-500">*</span></label>
                        <input type="text" id="fullname" placeholder="นายสมชาย ใจดี" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                    </div>

                    <!-- เพศ -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">เพศ <span class="text-rose-500">*</span></label>
                        <select id="gender" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                            <option value="" disabled selected>-- เลือกเพศ --</option>
                            <option value="ชาย">ชาย</option>
                            <option value="หญิง">หญิง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>

                    <!-- อายุ -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">อายุ (ปี) <span class="text-rose-500">*</span></label>
                        <input type="number" id="age" min="10" max="30" placeholder="17" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                    </div>

                    <!-- ระดับชั้น -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ระดับชั้น <span class="text-rose-500">*</span></label>
                        <select id="grade" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                            <option value="" disabled selected>-- เลือกระดับชั้น --</option>
                            <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
                            <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
                            <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
                            <option value="ปวช.">ปวช.</option>
                            <option value="ปวส.">ปวส.</option>
                        </select>
                    </div>

                    <!-- ชื่อโรงเรียน -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อโรงเรียน / วิทยาลัย <span class="text-rose-500">*</span></label>
                        <input type="text" id="school" placeholder="โรงเรียนวิทยาศาสตร์..." class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                    </div>

                    <!-- เบอร์โทรศัพท์ -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">เบอร์โทรศัพท์ <span class="text-rose-500">*</span></label>
                        <input type="tel" id="phone" pattern="[0-9]{9,10}" placeholder="0812345678" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                    </div>

                    <!-- Line ID -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Line ID <span class="text-rose-500">*</span></label>
                        <input type="text" id="lineId" placeholder="line_id" class="w-full rounded-xl border border-slate-300 p-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                    </div>

                    <!-- สาขาวิชาที่สนใจ -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">สาขาวิชาที่สนใจของคณะ IT <span class="text-rose-500">*</span></label>
                        <select id="major" class="w-full rounded-xl border border-slate-300 p-3 bg-indigo-50/50 text-indigo-900 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
                            <option value="" disabled selected>-- เลือกสาขาวิชาที่สนใจ --</option>
                            <option value="เทคโนโลยีธุรกิจดิจิทัล">เทคโนโลยีธุรกิจดิจิทัล</option>
                            <option value="เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล">เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล</option>
                            <option value="ดิจิทัลมีเดียอาร์ต">ดิจิทัลมีเดียอาร์ต</option>
                            <option value="วิศวกรรมความปลอดภัย">วิศวกรรมความปลอดภัย</option>
                            <option value="ไม่สนใจ">ยังไม่สนใจสาขาใดเป็นพิเศษ</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3.5 px-6 rounded-xl hover:opacity-95 shadow-md active:scale-[0.99] transition duration-200">
                        ยืนยันการลงทะเบียน
                    </button>
                </div>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-100/70 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-700 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-pink-500"></span>
                    Dashboard สรุปสถิติสาขาที่ได้รับความนิยม
                </h2>
                <span id="loadingStatus" class="text-xs font-medium text-slate-500 hidden animate-pulse">กำลังอัปเดตข้อมูล...</span>
            </div>
            
            <div class="p-6 md:p-8">
                <div class="w-full max-w-md mx-auto">
                    <canvas id="majorChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxlhdb-BhE9TzVtkXwbC_c9PbXj-i7cNw-aHkpZz9MOjV8IiM092jCfc_uqWPeWFyWy/exec';
        let majorChart = null;

        // ดึงข้อมูลสถิติจาก Google Sheets มาแสดงผลบน Dashboard
        function loadDashboardData() {
            const statusEl = document.getElementById('loadingStatus');
            statusEl.classList.remove('hidden');

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    updateChart(data);
                    statusEl.classList.add('hidden');
                })
                .catch(err => {
                    console.error('Error loading data:', err);
                    statusEl.classList.add('hidden');
                });
        }

        // วาดหรืออัปเดตกราฟ Chart.js
        function updateChart(counts) {
            const labels = Object.keys(counts);
            const values = Object.values(counts);
            const ctx = document.getElementById('majorChart').getContext('2d');

            if (majorChart) {
                majorChart.data.datasets[0].data = values;
                majorChart.update();
            } else {
                majorChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: [
                                '#6366F1', // เทคโนโลยีธุรกิจดิจิทัล
                                '#3B82F6', // เทคโนโลยีสารสนเทศฯ
                                '#EC4899', // ดิจิทัลมีเดียอาร์ต
                                '#10B981', // วิศวกรรมความปลอดภัย
                                '#94A3B8'  // ไม่สนใจ
                            ],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    font: { family: 'Prompt', size: 12 },
                                    padding: 16
                                }
                            }
                        }
                    }
                });
            }
        }

        // โหลดข้อมูล Dashboard ทันทีเมื่อเปิดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', loadDashboardData);

        // จัดการการส่งฟอร์มข้อมูล
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังส่งข้อมูล...';

            const formData = {
                prefix: document.getElementById('prefix').value,
                fullname: document.getElementById('fullname').value,
                gender: document.getElementById('gender').value,
                age: document.getElementById('age').value,
                grade: document.getElementById('grade').value,
                school: document.getElementById('school').value,
                phone: document.getElementById('phone').value,
                lineId: document.getElementById('lineId').value,
                major: document.getElementById('major').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('ลงทะเบียนสำเร็จ! ขอบคุณที่เข้าร่วมงาน Open House ครับ');
                document.getElementById('regForm').reset();
                btn.disabled = false;
                btn.innerText = 'ยืนยันการลงทะเบียน';
                
                // รอ 1.5 วินาที แล้วโหลดกราฟเพื่ออัปเดตสถิติล่าสุด
                setTimeout(loadDashboardData, 1500);
            })
            .catch(err => {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
                btn.disabled = false;
                btn.innerText = 'ยืนยันการลงทะเบียน';
            });
        });
    </script>
</body>
</html>
